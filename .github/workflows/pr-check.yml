name: PR Lint & Build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  lint_build:
    if: >
      github.event.pull_request.draft == false &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # setup-node 의 `cache: yarn` 은 쓰지 않는다.
      # 그 옵션은 캐시 폴더를 알아내려고 액션 안에서 `yarn cache dir` 을 돌리는데, 그 시점에는
      # 러너에 미리 깔린 yarn 1 만 PATH 에 있다. package.json 이 yarn 4 를 못 박아 두었으므로
      # yarn 1 이 실행을 거부하면서 잡이 죽는다. corepack 을 켠 뒤에 직접 캐시한다.
      - name: Enable Corepack
        run: corepack enable

      - name: Resolve Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Cache Yarn
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      # Build step only for develop->master PRs
      - name: Build
        if: >
          github.base_ref == 'master' &&
          github.head_ref == 'develop'
        run: yarn build